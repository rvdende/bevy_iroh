[package]
name = "bevy_iroh"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Share Bevy entities between peers over iroh: replication, rooms, presence and typed messages, with optional voice and video"
repository = "https://github.com/rvdende/bevy_iroh"
documentation = "https://docs.rs/bevy_iroh"
readme = "README.md"
keywords = ["bevy", "iroh", "p2p", "networking", "multiplayer"]
categories = ["game-development", "network-programming"]

[features]
default = []
## Voice over the same endpoint: `Voice` on a shared entity publishes the microphone, remote
## voices play back spatially. Pulls in cpal and libopus (built from source with cmake).
media = ["dep:cpal", "dep:opus", "dep:openh264", "dep:bytes", "dep:wgpu-types", "bevy/bevy_asset", "bevy/bevy_image"]
## A `bevy_v4l2` webcam as a `VideoSource`: `VideoInput::new(feed.capture.color_tap())`. Linux.
v4l2 = ["media", "dep:bevy_v4l2"]
## What only a browser has: an identity in localStorage and the ticket from the page URL. The
## core transport runs on wasm32 without this.
wasm = ["dep:web-sys", "dep:wasm-bindgen"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_log", "std"] }
iroh = "1.1"
iroh-gossip = "0.101"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
rand = "0.10"
n0-future = "0.3"
tracing = "0.1"
thiserror = "2"
data-encoding = "2"
anyhow = "1"
bytes = { version = "1", optional = true }
# The texture types `Image::new` takes; bevy_image does not re-export them.
wgpu-types = { version = "29", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
cpal = { version = "0.18", optional = true }
opus = { version = "0.4", optional = true }
openh264 = { version = "0.9", optional = true }
bevy_v4l2 = { version = "0.3", optional = true, default-features = false, features = ["mjpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros"] }
web-time = "1"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[package.metadata.docs.rs]
features = ["media", "v4l2"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The cube example puts the room's status in the tab title; the wasm test logs to the console.
web-sys = { version = "0.3", features = ["Window", "Document", "console"] }
wasm-bindgen-test = "0.3"
web-time = "1"

[dev-dependencies]
bevy = { version = "0.19", features = ["wayland", "x11"] }
tempfile = "3"
rand = "0.10"

[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "conference"
required-features = ["media"]

[[test]]
name = "voice"
required-features = ["media"]

[[test]]
name = "video"
required-features = ["media"]

# Until bevy_v4l2 0.3 is on crates.io. Stripped from the published manifest.
[patch.crates-io]
bevy_v4l2 = { path = "../bevy_v4l2" }

# The browser test: `dev` without debug info, which is most of a wasm binary's size and all
# of what makes a headless browser choke on it. `cargo test --profile wasm-test --target
# wasm32-unknown-unknown --features wasm --test wasm`.
[profile.wasm-test]
inherits = "dev"
debug = false
strip = "symbols"

[profile.wasm-test.package."*"]
opt-level = 3
