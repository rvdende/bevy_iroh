<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bevy_iroh EXAMPLE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #202428; color: #e6e6ea; font: 15px/1.5 system-ui, sans-serif; }
    header { display: flex; gap: 1rem; align-items: baseline; padding: .6rem 1rem; }
    header a { color: #6fd38a; text-decoration: none; }
    header .hint { color: #9a9ea6; font-size: .9em; }
    .stage { position: relative; height: 72vh; min-height: 360px; background: #15171a; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    section { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    pre { margin: 0; border-radius: 8px; overflow-x: auto; font-size: .88em; }
    code.hljs { padding: 1rem 1.2rem; }
  </style>
</head>
<body>
  <header>
    <a href="../">bevy_iroh</a>
    <b>EXAMPLE</b>
    <span class="hint">The address bar is the invitation once the room is up: copy it and send it. A desktop joins with the ticket in it.</span>
  </header>
  <div class="stage"><canvas id="bevy"></canvas></div>
  <section>
    <h2><code>examples/EXAMPLE.rs</code></h2>
    <pre><code id="source" class="language-rust">loading…</code></pre>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/rust.min.js"></script>
  <script>
    fetch("source.rs").then(r => r.text()).then(src => {
      const el = document.getElementById("source");
      el.textContent = src;
      hljs.highlightElement(el);
    });
  </script>
  <script type="module">
    import init from "./app.js";
    init().catch((e) => {
      // winit uses an exception for control flow once the event loop is running.
      if (!String(e).includes("Using exceptions for control flow")) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
